<span class="airline-identity">
  <span class="airline-mark" aria-hidden="true">
    @if (source() && failedSource() !== source()) {
      <img [src]="source()" alt="" width="32" height="32" (error)="failedSource.set(source())" />
    } @else {
      <span class="airline-code">{{ code() }}</span>
    }
  </span>
  <span>{{ name() }}</span>
</span>
