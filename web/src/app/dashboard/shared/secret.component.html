<section class="secret-panel" [class.secret-plain]="plain()" [attr.aria-label]="title()">
  @if (!plain()) {
    <h2>{{ title() }}</h2>
    <p>
      <ng-content>Keep this secret in a password manager. It will not be shown again.</ng-content>
    </p>
  }
  <label class="visually-hidden" [for]="fieldId">{{ title() }}</label>
  <input
    [id]="fieldId"
    class="form-control font-monospace"
    readonly
    [value]="value()"
    autocomplete="off"
    spellcheck="false"
    #secret
    (focus)="secret.select()"
  />
  @if (error()) {
    <p class="text-danger mt-2" role="alert">{{ error() }}</p>
  }
  <div class="secret-actions">
    <button type="button" class="btn btn-outline-primary" (click)="copy()">
      <i class="bi" [class.bi-copy]="!copied()" [class.bi-check2]="copied()" aria-hidden="true"></i>
      {{ copied() ? 'Copied' : 'Copy code' }}
    </button>
    <button type="button" class="btn btn-outline-primary" (click)="download()">
      <i class="bi bi-download" aria-hidden="true"></i> Download
    </button>
    <button type="button" class="btn btn-primary secret-confirm" (click)="dismissed.emit()">
      {{ confirmLabel() }}
    </button>
  </div>
  <span class="visually-hidden" role="status">{{
    copied() ? 'Code copied to clipboard.' : ''
  }}</span>
</section>
