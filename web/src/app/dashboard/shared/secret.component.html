<section class="secret-panel" [attr.aria-label]="title()">
  <h2>{{ title() }}</h2>
  <p>
    <ng-content>Keep this secret in a password manager. It will not be shown again.</ng-content>
  </p>
  <label class="visually-hidden" [for]="fieldId">{{ title() }}</label>
  <input
    [id]="fieldId"
    class="form-control font-monospace"
    readonly
    [value]="value()"
    autocomplete="off"
    spellcheck="false"
    #secret
    (focus)="secret.select()"
  />
  @if (error()) {
    <p class="text-danger mt-2" role="alert">{{ error() }}</p>
  }
  <div class="d-flex flex-wrap gap-2 mt-3">
    <button type="button" class="btn btn-outline-primary" (click)="copy()">
      {{ copied() ? 'Copied' : 'Copy code' }}
    </button>
    <button type="button" class="btn btn-outline-primary" (click)="download()">Download</button>
    <button type="button" class="btn btn-primary" (click)="dismissed.emit()">I’ve saved it</button>
  </div>
  <span class="visually-hidden" role="status">{{
    copied() ? 'Code copied to clipboard.' : ''
  }}</span>
</section>
