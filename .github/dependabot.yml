# Dependencies are pinned with hashes or digests; Dependabot proposes the bumps.
# Minor and patch releases arrive as one grouped pull request per ecosystem.
# Python requirements are compiled with uv, so run `make lock` in the same pull
# request: `make check` fails until the lock files match. See CONTRIBUTING.md.
# A release must be a week old before it is proposed, so a hijacked version has
# time to be noticed and withdrawn. Security updates are not delayed.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      angular:
        patterns: ["@angular/*"]
        update-types: ["minor", "patch"]
      frontend:
        patterns: ["*"]
        exclude-patterns: ["@angular/*"]
        update-types: ["minor", "patch"]
    ignore:
      # Angular decides which TypeScript major it supports.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      # The project targets Python 3.12; moving the runtime is a deliberate change
      # to pyproject.toml, CI and both images together. Digest updates still arrive.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: lambda/python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: terraform
    directory: /infra
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      # A provider major needs a reviewed plan against the deployed state.
      - dependency-name: hashicorp/aws
        update-types: ["version-update:semver-major"]
