name: CI

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  AWS_EC2_METADATA_DISABLED: "true"
  PYTHONUNBUFFERED: "1"

jobs:
  python:
    name: Python checks and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-next-dev.lock
      - name: Install locked Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r requirements-next-dev.lock
      - name: Compile, type check, lint, and test with coverage
        run: make next-check

  web:
    name: Dashboard build and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      PLAYWRIGHT_CHROME_CHANNEL: chromium
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-next-dev.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the local portal backend
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r requirements-next-dev.lock
      - name: Install locked frontend dependencies
        working-directory: web
        run: npm ci
      - name: Check formatting and build the dashboard
        working-directory: web
        run: |
          npm run format:check
          npm run test:types
          npm run build
      - name: Install Chromium and system dependencies
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Test the dashboard and actual local portal
        working-directory: web
        run: npm test -- --workers=2
      - name: Upload browser test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
          if-no-files-found: ignore
