[project]
name = "fareflare"
version = "2.0.0"
description = "Open-source flight price monitoring with Telegram alerts, webhooks, an HTTP API, and MCP"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests_next"]
pythonpath = ["src"]
addopts = "-q"
timeout = 60

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests_next"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pyright]
include = ["src/gfpt_next"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.coverage.run]
source = ["gfpt_next"]

[tool.coverage.report]
show_missing = true
fail_under = 80
