<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="base.css" />
    <style>
      #figure {
        position: relative;
        width: 1280px;
        height: 760px;
        overflow: hidden;
        border-radius: 36px;
        background: var(--paper-deep);
      }
      .desktop {
        position: absolute;
        top: 52px;
        left: 52px;
        width: 930px;
        border-radius: 18px;
        box-shadow:
          0 0 0 1px rgb(23 20 31 / 8%),
          0 40px 70px -40px rgb(23 20 31 / 55%);
      }
      .phone {
        position: absolute;
        width: 236px;
        padding: 9px;
        border-radius: 40px;
        background: var(--ink);
        box-shadow: 0 40px 60px -30px rgb(23 20 31 / 60%);
      }
      .phone img {
        display: block;
        width: 100%;
        border-radius: 31px;
      }
      .one {
        top: 128px;
        right: 236px;
        rotate: -3deg;
      }
      .two {
        top: 86px;
        right: 34px;
        rotate: 3deg;
      }
      .caption {
        position: absolute;
        bottom: 34px;
        left: 52px;
        display: flex;
        gap: 10px;
      }
    </style>
  </head>
  <body>
    <div id="figure">
      <img class="desktop" src="shots/dashboard-desktop.webp" alt="" />
      <div class="phone one"><img src="shots/dashboard-mobile-2.webp" alt="" /></div>
      <div class="phone two"><img src="shots/landing-mobile.webp" alt="" /></div>
      <div class="caption">
        <span class="chip ink">Each flight is a baggage tag</span>
        <span class="chip">Recorded prices, gaps left as gaps</span>
        <span class="chip lime">Example data</span>
      </div>
    </div>
  </body>
</html>
